name: Ensure admin user

on:
  workflow_dispatch:
    inputs:
      email:
        description: Admin email
        required: true
        type: string
      password:
        description: New admin password
        required: true
        type: string

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - name: Upsert admin on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.Server_Host }}
          username: ${{ secrets.Server_User }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ADMIN_EMAIL,ADMIN_PASSWORD
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/visage_site
            docker exec \
              -e ADMIN_EMAIL="$ADMIN_EMAIL" \
              -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
              makeup_backend python scripts/ensure_admin.py
        env:
          ADMIN_EMAIL: ${{ inputs.email }}
          ADMIN_PASSWORD: ${{ inputs.password }}
