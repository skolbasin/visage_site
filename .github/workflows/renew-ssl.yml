name: Renew SSL Certificate

on:
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Renew Let's Encrypt and reload nginx
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.Server_Host }}
          username: ${{ secrets.Server_User }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -e
            cd /opt/visage_site

            echo "=== Current cert in nginx/ssl ==="
            openssl x509 -in nginx/ssl/fullchain.pem -noout -subject -dates || true

            echo "=== Freeing ports 80/443 (stop stack + host web servers) ==="
            docker compose stop || true
            # stop any container still publishing 80/443
            for id in $(docker ps -q); do
              ports=$(docker port "$id" 2>/dev/null || true)
              echo "$ports" | grep -qE ':(80|443)' && docker stop "$id" || true
            done
            systemctl stop nginx 2>/dev/null || true
            systemctl stop apache2 2>/dev/null || true
            fuser -k 80/tcp 2>/dev/null || true
            fuser -k 443/tcp 2>/dev/null || true
            sleep 3
            echo "=== Listeners on 80/443 ==="
            ss -ltnp | grep -E ':80|:443' || echo "(none)"

            echo "=== Renewing certificate ==="
            if ! command -v certbot >/dev/null 2>&1; then
              apt-get update -y
              apt-get install -y certbot
            fi

            certbot renew --force-renewal --standalone \
              --preferred-challenges http \
              --non-interactive \
              --cert-name anastasia-romancha.ru

            LIVE_DIR="/etc/letsencrypt/live/anastasia-romancha.ru"
            echo "=== Copying from $LIVE_DIR ==="
            mkdir -p nginx/ssl
            cp -L "$LIVE_DIR/fullchain.pem" nginx/ssl/fullchain.pem
            cp -L "$LIVE_DIR/privkey.pem" nginx/ssl/privkey.pem
            chmod 644 nginx/ssl/fullchain.pem
            chmod 600 nginx/ssl/privkey.pem

            echo "=== New cert ==="
            openssl x509 -in nginx/ssl/fullchain.pem -noout -subject -dates

            echo "=== Starting stack ==="
            docker compose up -d
            sleep 3
            docker compose ps
            echo "Done"
