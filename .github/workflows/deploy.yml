name: Deploy to Server

concurrency:
  group: production-deploy
  cancel-in-progress: false

on:
  push:
    branches: [master]
    paths-ignore:
      - ".github/workflows/list-users.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: pytest-ci-secret-key
          RATE_LIMIT_ENABLED: "true"
          RATE_LIMIT_AUTH: 1000/minute
          RATE_LIMIT_DEFAULT: 1000/minute
          DATABASE_URL: sqlite://
        run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check server SSH reachability
        env:
          SERVER_HOST: ${{ secrets.Server_Host }}
        run: |
          if ! timeout 15 bash -c 'exec 3<>/dev/tcp/"$SERVER_HOST"/22; true' 2>/dev/null; then
            echo "Production server $SERVER_HOST is unreachable on SSH port 22"
            echo "Check host/VM/provider console and network reachability, then rerun deployment"
            exit 1
          fi

      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.Server_Host }}
          username: ${{ secrets.Server_User }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/visage_site
            timeout 25m ./scripts/deploy.sh
