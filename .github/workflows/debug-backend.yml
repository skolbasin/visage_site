name: Debug backend

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server containers
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.Server_Host }}
          username: ${{ secrets.Server_User }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/visage_site
            echo "=== docker ps -a ==="
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            echo "=== backend logs ==="
            docker logs --tail 80 makeup_backend || true
            echo "=== postgres logs ==="
            docker logs --tail 40 makeup_postgres || true
